<!doctype html>
<!-- Development helper: shows the game at phone sizes on a desktop screen. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ape or Rug — phone preview</title>
    <style>
      body { margin: 0; background: #222; display: flex; gap: 24px; padding: 16px; align-items: flex-start; font: 12px system-ui; color: #aaa; }
      figure { margin: 0; }
      iframe { border: 1px solid #555; background: #000; display: block; }
    </style>
  </head>
  <body>
    <figure><iframe src="/" width="390" height="844" title="390 x 844"></iframe>390 × 844</figure>
    <figure><iframe src="/" width="360" height="640" title="360 x 640"></iframe>360 × 640</figure>
  </body>
</html>
